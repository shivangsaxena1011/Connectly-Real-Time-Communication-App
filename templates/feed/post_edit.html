{% extends 'base.html' %}

{% block title %}Edit Post - Connectly{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-8">
  <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
    <h2 class="font-heading font-bold text-xl text-slate-900 mb-4">Edit Post</h2>
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Content</label>
          <textarea name="content" rows="4" required class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 resize-none">{{ post.content }}</textarea>
        </div>

        {% if post.image %}
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Current Image</label>
            <img src="{{ post.image.url }}" class="w-full max-h-60 object-cover rounded-xl border border-slate-200 mb-2" />
          </div>
        {% endif %}

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Update Image (optional)</label>
          <input type="file" name="image" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
        </div>

        <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
          <a href="{% url 'post_detail' post.id %}" class="text-slate-600 hover:text-slate-800 text-xs font-semibold px-4 py-2">Cancel</a>
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs px-5 py-2 rounded-xl transition">Save Changes</button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
